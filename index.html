<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Madrasa Student Performance Manager</title>
  <meta name="description" content="Offline-first Madrasa Student Performance Manager for tracking daily academic, discipline, prayer, and lesson scores.">
  <meta name="theme-color" content="#1e1b4b">
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app">
    <!-- Top Header Bar -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo">M</div>
        <div class="brand-text">
          <h1>MADRASA MANAGER</h1>
          <p>Student Performance System</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="offline-tag" class="offline-badge">
          <span class="status-dot"></span> Local Mode
        </div>
      </div>
    </header>

    <!-- Main Shell Layout -->
    <div class="app-body">
      <!-- Sidebar Navigation (Desktop) -->
      <aside class="desktop-sidebar">
        <div class="sidebar-nav">
          <a href="#/dashboard" class="nav-item">
            <span class="nav-icon">📊</span> Dashboard
          </a>
          <a href="#/classes" class="nav-item">
            <span class="nav-icon">📁</span> Classes
          </a>
          <a href="#/daily" class="nav-item">
            <span class="nav-icon">⚡</span> Daily Performance
          </a>
          <a href="#/students" class="nav-item">
            <span class="nav-icon">👥</span> Students
          </a>
          <a href="#/reports" class="nav-item">
            <span class="nav-icon">📈</span> Reports
          </a>
          <a href="#/rankings" class="nav-item">
            <span class="nav-icon">🏆</span> Rankings
          </a>
          <a href="#/settings" class="nav-item">
            <span class="nav-icon">⚙️</span> Settings
          </a>
        </div>
      </aside>

      <!-- Main Content Route Container -->
      <main class="main-content" id="main-container">
        <div class="spinner"></div>
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
      <a href="#/dashboard" class="mobile-nav-item">
        <span class="mobile-nav-icon">📊</span>
        <span>Home</span>
      </a>
      <a href="#/classes" class="mobile-nav-item">
        <span class="mobile-nav-icon">📁</span>
        <span>Classes</span>
      </a>
      <a href="#/daily" class="mobile-nav-item">
        <span class="mobile-nav-icon">⚡</span>
        <span>Daily</span>
      </a>
      <a href="#/students" class="mobile-nav-item">
        <span class="mobile-nav-icon">👥</span>
        <span>Students</span>
      </a>
      <a href="#/reports" class="mobile-nav-item">
        <span class="mobile-nav-icon">📈</span>
        <span>Reports</span>
      </a>
      <a href="#/rankings" class="mobile-nav-item">
        <span class="mobile-nav-icon">🏆</span>
        <span>Rankings</span>
      </a>
      <a href="#/settings" class="mobile-nav-item">
        <span class="mobile-nav-icon">⚙️</span>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
